name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: mypy app/query app/cleaning
      - run: pytest
      - run: python -m app.evaluate --input evaluation_cases/cases.json --output evaluation-results.json --artifacts-dir evaluation_output --provider replay --cassettes evaluation_cases/cassettes --skip-injection
